<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sugarplum's Collection!!</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-color: #fff0f5;
      --card-bg: #ffffff;
      --pink-primary: #ffb7c5;
      --pink-accent: #ff69b4;
      --pink-dark: #d84374;
      --text-color: #5a3e4b;
      --correct-green: #a8e6cf;
      --wrong-pink: #ffaaa5;
      --border-radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', sans-serif; }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-color); 
      display: flex; 
      flex-direction: column; 
      align-items: center;
      min-height: 100vh; 
      padding: 20px;
    }

    header { 
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    header h1 { 
      color: var(--pink-dark);
      font-size: 2.5rem;
      margin: 0;
      text-shadow: 2px 2px 0px #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    nav { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }

    nav button { 
      background-color: var(--pink-primary);
      color: var(--pink-dark);
      border: 2px solid var(--pink-accent);
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 6px rgba(255, 105, 180, 0.2);
    }

    nav button.active, nav button:hover { 
      background-color: var(--pink-accent);
      color: #fff;
      transform: translateY(-2px);
    }

    main { width: 100%; max-width: 1000px; margin: 0 auto; flex: 1; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .search-bar-container { 
      display: flex; 
      gap: 1rem; 
      margin-bottom: 2rem; 
      flex-wrap: wrap; 
      justify-content: center; 
      align-items: center;
    }

    input[type="text"], select { 
      padding: 12px 20px;
      font-size: 1rem;
      border: 3px solid var(--pink-primary);
      border-radius: 30px;
      outline: none;
      background: white;
      color: var(--text-color);
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.15);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--pink-accent);
    }

    input[type="text"] { flex: 2; min-width: 220px; }
    select { flex: 1; min-width: 200px; }

    .btn { 
      background-color: var(--pink-primary);
      color: var(--pink-dark);
      border: 2px solid var(--pink-accent);
      padding: 10px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 6px rgba(255, 105, 180, 0.2);
    }

    .btn:hover { 
      background-color: var(--pink-accent);
      color: #fff;
      transform: translateY(-2px);
    }

    .btn-wishlist { 
      background-color: #ffe3ec; 
      color: var(--pink-dark); 
      border-color: var(--pink-primary);
      width: 100%;
    }

    .btn-remove { 
      background-color: var(--wrong-pink); 
      color: #721c24;
      border-color: #ff8fa3;
      width: 100%;
    }

    .btn-holo {
      background-color: #e8dff5;
      color: #6a4c93;
      border-color: #b8c0ff;
    }

    .btn-holo.is-active {
      background-color: #9381ff;
      color: #ffffff;
      border-color: #7058f8;
      box-shadow: 0 0 10px rgba(147, 129, 255, 0.6);
    }

    .card-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
      gap: 1.5rem; 
    }

    .card-item { 
      position: relative;
      background: var(--card-bg); 
      border-radius: var(--border-radius); 
      padding: 1.2rem; 
      box-shadow: 0 4px 12px rgba(255, 182, 193, 0.3); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      text-align: center; 
      border: 3px solid var(--pink-primary);
      transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
      overflow: hidden;
    }

    .card-item.holo-card {
      border-color: #a855f7;
      background: linear-gradient(135deg, #ffffff 0%, #fff0f5 40%, #e6e6fa 70%, #ffffff 100%);
      box-shadow: 0 0 15px rgba(255, 105, 180, 0.4), 0 0 25px rgba(184, 192, 255, 0.5);
    }

    .card-item.holo-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        115deg,
        transparent 20%,
        rgba(255, 182, 193, 0.25) 30%,
        rgba(255, 255, 255, 0.6) 45%,
        rgba(184, 192, 255, 0.25) 60%,
        transparent 80%
      );
      pointer-events: none;
      transform: rotate(25deg);
      opacity: 0.85;
    }

    .card-item:hover { 
      transform: translateY(-5px); 
      box-shadow: 0 10px 22px rgba(255, 105, 180, 0.4); 
    }

    .card-item.holo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.6), 0 0 35px rgba(184, 192, 255, 0.7);
    }

    .card-item img { 
      position: relative;
      z-index: 1;
      width: 100%; 
      max-width: 160px; 
      height: auto; 
      border-radius: 12px; 
      margin-bottom: 0.85rem; 
      object-fit: contain;
    }

    .card-item h3 { 
      position: relative;
      z-index: 1;
      font-size: 1.15rem; 
      margin-bottom: 0.25rem; 
      color: var(--pink-dark);
    }

    .card-item p { 
      position: relative;
      z-index: 1;
      font-size: 0.85rem; 
      color: var(--text-color); 
      margin-bottom: 0.85rem; 
      opacity: 0.85;
    }

    .card-actions { 
      position: relative;
      z-index: 1;
      display: flex; 
      flex-direction: column; 
      gap: 0.5rem; 
      width: 100%; 
      margin-top: auto; 
    }

    .action-row {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }

    .action-row .btn {
      flex: 1;
    }

    .badges-container {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 0.4rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
      min-height: 28px;
      align-items: center;
    }

    .badge { 
      background: var(--bg-color); 
      color: var(--pink-dark);
      border: 1px solid var(--pink-primary);
      padding: 0.35rem 0.75rem; 
      border-radius: 12px; 
      font-size: 0.85rem; 
      font-weight: 600; 
      display: inline-block; 
    }

    .badge-holo {
      background: linear-gradient(135deg, #f0e6ff 0%, #d8b4fe 100%);
      color: #4c1d95;
      border: 1px solid #a855f7;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(168, 85, 247, 0.4);
      animation: holoPulse 2s infinite alternate;
    }

    @keyframes holoPulse {
      0% { box-shadow: 0 0 4px rgba(168, 85, 247, 0.4); }
      100% { box-shadow: 0 0 12px rgba(168, 85, 247, 0.8); }
    }

    .status-msg { 
      text-align: center; 
      font-size: 1.1rem; 
      color: var(--pink-dark); 
      margin-top: 3rem; 
      line-height: 1.6; 
      font-weight: 600;
    }

    .stats-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 1.5rem; 
      margin-bottom: 1.5rem; 
      background: white; 
      padding: 1rem 1.5rem; 
      border-radius: var(--border-radius); 
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.15); 
      flex-wrap: wrap; 
      border: 3px dashed var(--pink-accent);
    }

    .stat-box { font-weight: 600; color: var(--text-color); }
    .stat-box span { color: var(--pink-dark); }
  </style>
</head>
<body>

  <header>
    <h1>💗Sugarplum's Pokemon Cards💗</h1>
    <p class="subtitle" style="color: var(--pink-accent); font-size: 1.1rem;">My baby's personal database!</p>
    <nav>
      <button class="nav-btn active" onclick="switchTab('browse')">🔍 Find Cards</button>
      <button class="nav-btn" onclick="switchTab('collection')">📖 Collection</button>
      <button class="nav-btn" onclick="switchTab('wishlist')">⭐ Wishlist</button>
    </nav>
  </header>

  <main>
    <div class="stats-bar">
      <div>
        <span class="stat-box">Owned Cards: <span id="ownedCount">0</span></span>
        &nbsp;|&nbsp;
        <span class="stat-box">Wishlist Items: <span id="wishlistCount">0</span></span>
      </div>
    </div>

    <section id="browse" class="tab-content active">
      <div class="search-bar-container">
        <input type="text" id="searchInput" placeholder="Search across ALL sets (e.g., Charizard, Pikachu)...">
        
        <select id="setSelect" onchange="fetchSetCards(this.value)">
          <option value="">-- Loading sets for my baby --</option>
        </select>
        
        <button class="btn" onclick="globalSearch()">Search</button>
      </div>

      <div id="browseGrid" class="card-grid"></div>
      <div id="browseStatus" class="status-msg">Loading sets for my baby</div>
    </section>

    <section id="collection" class="tab-content">
      <div id="collectionGrid" class="card-grid"></div>
      <div id="collectionStatus" class="status-msg" style="display:none;">You haven't added any cards yet my baby!</div>
    </section>

    <section id="wishlist" class="tab-content">
      <div id="wishlistGrid" class="card-grid"></div>
      <div id="wishlistStatus" class="status-msg" style="display:none;">You haven't wished for any cards yet my baby! Speaking of wishes I wish you were in my arms right now hehe</div>
    </section>
  </main>

  <script>
    const RAW_BASE = 'https://raw.githubusercontent.com/PokemonTCG/pokemon-tcg-data/master';

    const firebaseConfig = {
      apiKey: "AIzaSyD8GSpg3wS5Qrx6uy5hXj38i7Mkkb21vls",
      authDomain: "sugarplum-s-pokemon-cards.firebaseapp.com",
      databaseURL: "https://sugarplum-s-pokemon-cards-default-rtdb.firebaseio.com",
      projectId: "sugarplum-s-pokemon-cards",
      storageBucket: "sugarplum-s-pokemon-cards.firebasestorage.app",
      messagingSenderId: "820235181682",
      appId: "1:820235181682:web:afbd0dd5060b6655c96ceb"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let collection = {};
    let wishlist = {};
    let setsMap = {};
    let globalIndex = [];
    let currentRenderedCards = [];

    db.ref('user_data').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      collection = data.collection || {};
      wishlist = data.wishlist || {};
      
      updateStats();
    
      const activeTab = document.querySelector('.tab-content.active')?.id;
      if (activeTab === 'collection') renderCollection();
      if (activeTab === 'wishlist') renderWishlist();
    });

    function saveData() {
      db.ref('user_data').set({
        collection: collection,
        wishlist: wishlist
      });
      updateStats();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');

      if (tabId === 'collection') renderCollection();
      if (tabId === 'wishlist') renderWishlist();
    }

    async function initializeApp() {
      const browseStatus = document.getElementById('browseStatus');
      const setSelect = document.getElementById('setSelect');

      try {
        const res = await fetch(`${RAW_BASE}/sets/en.json`);
        const sets = await res.json();

        setSelect.innerHTML = '<option value="">-- Pick a set here my love --</option>';
        sets.sort((a, b) => new Date(b.releaseDate) - new Date(a.releaseDate));

        sets.forEach(set => {
          setsMap[set.id] = set.name;
          const opt = document.createElement('option');
          opt.value = set.id;
          opt.textContent = `${set.name} (${set.series})`;
          setSelect.appendChild(opt);
        });

        browseStatus.textContent = 'Finding all the cards for my baby';
        buildGlobalIndex(sets);
      } catch (err) {
        browseStatus.innerHTML = `Something went wrong :(( please text or call mookie to fix this!`;
      }
    }

    async function buildGlobalIndex(sets) {
      const browseStatus = document.getElementById('browseStatus');
      
      const batchSize = 10;
      for (let i = 0; i < sets.length; i += batchSize) {
        const batch = sets.slice(i, i + batchSize);
        await Promise.all(batch.map(async (set) => {
          try {
            const res = await fetch(`${RAW_BASE}/cards/en/${set.id}.json`);
            const cards = await res.json();
            globalIndex.push(...cards);
          } catch (e) {}
        }));
      }

      browseStatus.textContent = `Loaded ${globalIndex.length.toLocaleString()} cards for my pretty girl to look at! Dang now I'm just thinking of how pretty my girlfriend is omg`;
    }

    function globalSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const browseGrid = document.getElementById('browseGrid');
      browseStatus = document.getElementById('browseStatus');

      if (!query) return;

      document.getElementById('setSelect').value = '';
      browseGrid.innerHTML = '';

      const matches = globalIndex.filter(card => 
        (card.name || '').toLowerCase().includes(query)
      );

      if (matches.length === 0) {
        browseStatus.style.display = 'block';
        browseStatus.textContent = `Oh no sugar plum :( I sorry I couldn't find any cards with "${query}" in the name! What the heck mr pokemon my sugar plum wants cards called ${query}!`;
        return;
      }

      browseStatus.style.display = 'none';
      currentRenderedCards = matches.slice(0, 100);
      renderSearchResults(currentRenderedCards);
    }

    async function fetchSetCards(setId) {
      const browseGrid = document.getElementById('browseGrid');
      const browseStatus = document.getElementById('browseStatus');
      document.getElementById('searchInput').value = '';

      if (!setId) return;

      browseGrid.innerHTML = '';
      browseStatus.style.display = 'block';
      browseStatus.textContent = `Getting my baby's cards from ${setsMap[setId]}...`;

      try {
        const res = await fetch(`${RAW_BASE}/cards/en/${setId}.json`);
        currentRenderedCards = await res.json();

        browseStatus.style.display = 'none';
        renderSearchResults(currentRenderedCards);
      } catch (err) {
        browseStatus.textContent = `Something went wrong with ${setId} :(( call mookie to fix it!`;
      }
    }

    function renderSearchResults(cards) {
      const browseGrid = document.getElementById('browseGrid');
      browseGrid.innerHTML = cards.map(card => {
        const cardId = card.id;
        const cardName = card.name || 'Unnamed Card';
        const isOwned = collection[cardId];
        const isWished = wishlist[cardId];
        const isHolo = isOwned ? collection[cardId].isHolo : false;
        const imageUrl = card.images?.small || 'https://via.placeholder.com/180x250?text=No+Image';
        const setId = card.id.split('-')[0];
        const setName = setsMap[setId] || 'Pokémon TCG';
        const cardNum = card.number ? `#${card.number}` : '';

        return `
          <div class="card-item ${isHolo ? 'holo-card' : ''}">
            <img src="${imageUrl}" alt="${cardName}" loading="lazy">
            <h3>${cardName}</h3>
            <p>${setName} ${cardNum}</p>
            <div class="badges-container">
              ${isHolo ? '<span class="badge badge-holo">✨ Holo</span>' : ''}
            </div>
            <div class="card-actions">
              <div class="action-row">
                <button class="btn" onclick="addToCollection('${cardId}', '${escapeQuotes(cardName)}', '${imageUrl}', '${escapeQuotes(setName)}', this)">
                  ${isOwned ? 'Add (' + isOwned.qty + ')' : '+ Add'}
                </button>
                <button class="btn btn-holo ${isHolo ? 'is-active' : ''}" onclick="toggleHoloInBrowse('${cardId}', '${escapeQuotes(cardName)}', '${imageUrl}', '${escapeQuotes(setName)}', this)">
                  ${isHolo ? '✨ Holo' : '⭐ Holo'}
                </button>
              </div>
              <button class="btn btn-wishlist" onclick="toggleWishlist('${cardId}', '${escapeQuotes(cardName)}', '${imageUrl}', '${escapeQuotes(setName)}', this)">
                ${isWished ? '★ On Wishlist' : '☆ Add to Wishlist'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function addToCollection(id, name, image, setName, buttonEl, isHolo = false) {
      if (collection[id]) {
        collection[id].qty += 1;
        if (isHolo) collection[id].isHolo = true;
      } else {
        collection[id] = { id, name, image, setName, qty: 1, isHolo: isHolo };
      }
      saveData();
      
      if (buttonEl) {
        buttonEl.textContent = `Add (${collection[id].qty})`;
      }
    }

    function toggleHoloInBrowse(id, name, image, setName, buttonEl) {
      if (!collection[id]) {
        collection[id] = { id, name, image, setName, qty: 1, isHolo: true };
      } else {
        collection[id].isHolo = !collection[id].isHolo;
      }
      saveData();
      
      const cardContainer = buttonEl.closest('.card-item');
      let badgesContainer = cardContainer.querySelector('.badges-container');
      
      if (collection[id].isHolo) {
        cardContainer.classList.add('holo-card');
        buttonEl.classList.add('is-active');
        buttonEl.textContent = '✨ Holo';
        if (!badgesContainer.querySelector('.badge-holo')) {
          badgesContainer.innerHTML = '<span class="badge badge-holo">✨ Holo</span>';
        }
      } else {
        cardContainer.classList.remove('holo-card');
        buttonEl.classList.remove('is-active');
        buttonEl.textContent = '⭐ Holo';
        badgesContainer.innerHTML = '';
      }

      const addBtn = cardContainer.querySelector('.action-row .btn');
      if (addBtn && collection[id]) {
        addBtn.textContent = `Add (${collection[id].qty})`;
      }
    }

    function toggleHolo(id) {
      if (collection[id]) {
        collection[id].isHolo = !collection[id].isHolo;
        saveData();
        renderCollection();
      }
    }

    function removeFromCollection(id, buttonEl) {
      if (collection[id]) {
        delete collection[id];
        saveData();
        if (buttonEl) {
          buttonEl.closest('.card-item').remove();
        }
      }
    }

    function changeQuantity(id, delta) {
      if (collection[id]) {
        collection[id].qty += delta;
        if (collection[id].qty <= 0) {
          delete collection[id];
        }
        saveData();
        renderCollection();
      }
    }

    function renderCollection() {
      const grid = document.getElementById('collectionGrid');
      const status = document.getElementById('collectionStatus');
      const cards = Object.values(collection);

      if (cards.length === 0) {
        grid.innerHTML = '';
        status.style.display = 'block';
        return;
      }

      status.style.display = 'none';
      grid.innerHTML = cards.map(card => `
        <div class="card-item ${card.isHolo ? 'holo-card' : ''}">
          <img src="${card.image}" alt="${card.name}">
          <h3>${card.name}</h3>
          <p>${card.setName}</p>
          <div class="badges-container">
            <span class="badge">Quantity: ${card.qty}</span>
            ${card.isHolo ? '<span class="badge badge-holo">✨ Holo</span>' : ''}
          </div>
          <div class="card-actions">
            <div style="display:flex; gap:0.5rem; width:100%;">
              <button class="btn" style="flex:1" onclick="changeQuantity('${card.id}', 1)">+</button>
              <button class="btn" style="flex:1" onclick="changeQuantity('${card.id}', -1)">-</button>
            </div>
            <button class="btn btn-holo ${card.isHolo ? 'is-active' : ''}" onclick="toggleHolo('${card.id}')">
              ${card.isHolo ? '✨ Holo Card' : '⭐ Make Holo'}
            </button>
            <button class="btn btn-remove" onclick="removeFromCollection('${card.id}', this)">Remove All</button>
          </div>
        </div>
      `).join('');
    }

    function toggleWishlist(id, name, image, setName, buttonEl) {
      if (wishlist[id]) {
        delete wishlist[id];
        if (buttonEl) buttonEl.textContent = '☆ Add to Wishlist';
      } else {
        wishlist[id] = { id, name, image, setName };
        if (buttonEl) buttonEl.textContent = '★ On Wishlist';
      }
      saveData();
    }

    function removeFromWishlist(id, buttonEl) {
      if (wishlist[id]) {
        delete wishlist[id];
        saveData();
        if (buttonEl) {
          buttonEl.closest('.card-item').remove();
        }
      }
    }

    function moveToCollection(id, buttonEl, isHolo = false) {
      const item = wishlist[id];
      if (item) {
        addToCollection(item.id, item.name, item.image, item.setName, null, isHolo);
        delete wishlist[id];
        saveData();
        if (buttonEl) {
          buttonEl.closest('.card-item').remove();
        }
      }
    }

    function renderWishlist() {
      const grid = document.getElementById('wishlistGrid');
      const status = document.getElementById('wishlistStatus');
      const cards = Object.values(wishlist);

      if (cards.length === 0) {
        grid.innerHTML = '';
        status.style.display = 'block';
        return;
      }

      status.style.display = 'none';
      grid.innerHTML = cards.map(card => `
        <div class="card-item">
          <img src="${card.image}" alt="${card.name}">
          <h3>${card.name}</h3>
          <p>${card.setName}</p>
          <div class="card-actions">
            <div class="action-row">
              <button class="btn" onclick="moveToCollection('${card.id}', this, false)">Add to Collection</button>
              <button class="btn btn-holo" onclick="moveToCollection('${card.id}', this, true)">Add Holo</button>
            </div>
            <button class="btn btn-remove" onclick="removeFromWishlist('${card.id}', this)">Remove</button>
          </div>
        </div>
      `).join('');
    }

    function updateStats() {
      const ownedTotal = Object.values(collection).reduce((acc, curr) => acc + curr.qty, 0);
      const wishlistTotal = Object.keys(wishlist).length;

      document.getElementById('ownedCount').textContent = ownedTotal;
      document.getElementById('wishlistCount').textContent = wishlistTotal;
    }

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') globalSearch();
    });

    updateStats();
    initializeApp();
  </script>
</body>
</html>
